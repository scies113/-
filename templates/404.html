{% extends 'base.html' %}

{% block title %}404 — Страница не найдена{% endblock %}

{% block content %}
<div class="row justify-content-center text-center my-5">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm p-4 border-0">
      <h1 class="display-1 text-danger fw-bold">404</h1>
      <h2 class="h4 mb-3">Запрашиваемая страница или объект не найдены</h2>
      <p class="text-muted">
        {{ message|default:"Возможно, запрашиваемая страница была удалена или вы перешли по неверной ссылке." }}
      </p>
      <div class="mt-3">
        <a href="{% url 'homepage:index' %}" class="btn btn-success">Вернуться на главную</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
