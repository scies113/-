{% if page_obj.has_other_pages %}
<nav class="d-flex flex-wrap gap-3 align-items-center mt-4" aria-label="Страницы результатов">
  {% if page_obj.has_previous %}
    <a class="btn btn-outline-secondary" href="{% querystring page=page_obj.previous_page_number %}">Предыдущая</a>
  {% endif %}
  <span>Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a class="btn btn-outline-secondary" href="{% querystring page=page_obj.next_page_number %}">Следующая</a>
  {% endif %}
</nav>
{% endif %}
